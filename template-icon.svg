<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- house-style full-bleed tile; ember/slate reads "registry, tools, routing"
         and stays distinct from openwa's WhatsApp green -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#EA5A1F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" rx="120" fill="url(#bg)"/>

  <!-- three stacked registry rows (the core metaphor: a list/index of tools).
       Top row: filled white — "the capability in focus".
       Middle + bottom: outlined white — the rest of the registry. -->
  <g>
    <!-- row 1 (filled) -->
    <rect x="150" y="220" width="500" height="80" rx="40" fill="#FFFFFF"/>
    <!-- a small "call" chip on the left of the filled row (the tool's call path) -->
    <circle cx="215" cy="260" r="24" fill="#EA5A1F"/>

    <!-- row 2 (outlined) -->
    <rect x="150" y="360" width="500" height="80" rx="40"
          fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <circle cx="215" cy="400" r="24" fill="none" stroke="#FFFFFF" stroke-width="12"/>

    <!-- row 3 (outlined) -->
    <rect x="150" y="500" width="500" height="80" rx="40"
          fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <circle cx="215" cy="540" r="24" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  </g>

  <!-- a small "live / routing" node in the top-right — this is a registry +
       router combined, which distinguishes treg from a plain list UI. -->
  <circle cx="590" cy="200" r="26" fill="#FFFFFF"/>
  <circle cx="590" cy="200" r="14" fill="#EA5A1F"/>
</svg>
